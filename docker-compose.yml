services:
  postgres:
    image: postgres:16-alpine
    container_name: foresight-postgres
    environment:
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: foresight
      POSTGRES_DB: foresight
    ports:
      - "5432:5432"
    volumes:
      - foresight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight -d foresight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foresight_pgdata:
